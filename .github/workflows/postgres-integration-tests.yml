name: PostgreSQL Integration Tests

# CI 工作流：在 GitHub Actions 中使用 postgres:16 服务容器运行 PG 集成测试
# 消除对开发者本地 Docker PostgreSQL 实例的依赖

on:
  pull_request:
    branches: [main]
  push:
    branches: [ci-postgres-integration-tests, chore/ci-postgres-integration-tests]

jobs:
  pg-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # pg_isready 健康检查 — 硬性要求，防止服务未就绪时启动测试导致误报 CI 失败
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装后端依赖
        # 从 cloud-backend/pyproject.toml 读取 [project].dependencies
        # 和 [project.optional-dependencies].dev，不使用 editable install
        # app 包通过 working-directory 自然可导入
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi>=0.115.0" \
            "uvicorn[standard]>=0.30.0" \
            "PyJWT>=2.10.0" \
            "passlib[bcrypt]>=1.7.4" \
            "sqlalchemy[asyncio]>=2.0.0" \
            "asyncpg>=0.30.0" \
            "alembic>=1.14.0" \
            "pydantic-settings>=2.0.0" \
            "openai>=1.0.0" \
            "pytest>=8.0" \
            "pytest-asyncio>=0.24.0" \
            "httpx>=0.27.0" \
            "aiosqlite>=0.20.0"

      - name: 运行 PostgreSQL 迁移集成测试
        working-directory: ad-assistant/cloud-backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/postgres
        run: pytest tests/test_migrations_integration.py -v

openapi: "3.0.3"
info:
  title: Plans API
  version: 0.1.0
  description: Membership plan listing endpoint.

paths:
  /api/v1/plans:
    get:
      summary: List all active membership plans
      operationId: getPlans
      tags: [Plans]
      security: []  # public endpoint
      responses:
        "200":
          description: Plan list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/PlanListData"
                  error:
                    type: "null"
                  request_id:
                    type: string
              example:
                success: true
                data:
                  items:
                    - id: "00000000-0000-0000-0000-000000000001"
                      name: "标准版"
                      code: "standard"
                      price_cny: 359
                      monthly_credits: 500
                      features:
                        - "AI 文案生成"
                        - "OCR 文字识别"
                        - "基础图片处理"
                        - "每月 500 算力额度"
                      sort_order: 1
                      status: "active"
                    - id: "00000000-0000-0000-0000-000000000002"
                      name: "专家版"
                      code: "expert"
                      price_cny: 559
                      monthly_credits: 1000
                      features:
                        - "AI 文案生成"
                        - "AI 效果图生成"
                        - "OCR 文字识别"
                        - "图片改尺寸"
                        - "智能抠图"
                        - "每月 1000 算力额度"
                        - "优先客服支持"
                      sort_order: 2
                      status: "active"
                  total: 2
                error: null
                request_id: "req_a1b2c3d4e5f6"

components:
  schemas:
    PlanListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlanResponse"
        total:
          type: integer

    PlanResponse:
      type: object
      required: [id, name, code, price_cny, monthly_credits, features, sort_order, status]
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
        price_cny:
          type: integer
        monthly_credits:
          type: integer
        features:
          type: array
          items:
            type: string
        sort_order:
          type: integer
        status:
          type: string
